services:
  chartmaker:
    image: ghcr.io/n129bz/mapserver:latest
    container_name: mapserver
    restart: unless-stopped
    # Share host network stack on Linux so server.js binds directly to local settings.json "httpport"
    network_mode: host
    volumes:
      - ./tiles:/mapserver/tiles
      - .:/mapserver/config
    environment:
      - DOCKER=true
